; PyroPen firmware - PlatformIO project
; Target MCU: ATtiny1616 (tinyAVR 1-series, QFN-20), programmed over UPDI.
; Core: megaTinyCore (Spence Konde) via PlatformIO's atmelmegaavr platform.
;
; Clock: the board is powered at +3.3V (MAX17222 boost). Per the tinyAVR
; speed/voltage curve, 20 MHz needs >=4.5V, so we run the internal oscillator
; at 10 MHz, which is safely in spec at 3.3V.

[env:ATtiny1616]
platform  = atmelmegaavr
board     = ATtiny1616
framework = arduino

; --- clock ---
board_build.f_cpu        = 10000000L
board_hardware.oscillator = internal

; --- brown-out / EEPROM retention (safe defaults) ---
board_hardware.bod       = 2.6v
board_hardware.eesave    = yes

; --- upload over UPDI (single-wire) ---
; SerialUPDI works through any serial port with the classic
; "TX --[1k]-- RX, single wire to UPDI" adapter, OR a Raspberry Pi's GPIO UART.
upload_protocol = serialupdi
upload_speed    = 115200        ; safe for a Pi mini-UART; USB adapters can do 230400
; Set the port for your programmer:
;   Windows USB-serial : COM4
;   Raspberry Pi UART  : /dev/serial0   (enable UART, disable serial console)
;   USB-serial on Linux: /dev/ttyUSB0
; upload_port = /dev/serial0

; --- serial monitor (USART0 on PB2/PB3) ---
monitor_speed = 115200

; --- libraries ---
lib_deps =
    adafruit/Adafruit MLX90614 Library@^2.1.5
